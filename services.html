<script>
/* =========================================
   CHARMING BEAUTY CARE
   SERVICE SELECTION SYSTEM
   ========================================= */

let selectedServices = [];

/* Safely load saved services */
try {
    const saved = localStorage.getItem("selectedServices");

    if (saved) {
        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
            selectedServices = parsed;
        }
    }
} catch (error) {
    console.log("Invalid old service data cleared.");
    localStorage.removeItem("selectedServices");
    selectedServices = [];
}


/* ADD SERVICE */
function addService(serviceName, button) {

    if (!selectedServices.includes(serviceName)) {

        selectedServices.push(serviceName);

        localStorage.setItem(
            "selectedServices",
            JSON.stringify(selectedServices)
        );
    }

    updateBasket();

    if (button) {
        button.classList.add("added");
        button.textContent = "✓ ADDED";
    }
}


/* UPDATE BASKET */
function updateBasket() {

    const countElement =
        document.getElementById("basketCount");

    const itemsElement =
        document.getElementById("basketItems");

    if (!countElement || !itemsElement) {
        return;
    }

    const count = selectedServices.length;

    if (count === 0) {

        countElement.textContent =
            "0 Services Selected";

        itemsElement.textContent =
            "Select services to continue";

        return;
    }

    countElement.textContent =
        count === 1
            ? "1 Service Selected"
            : count + " Services Selected";

    itemsElement.textContent =
        selectedServices.join(" • ");
}


/* RESTORE BUTTON STATUS AFTER REFRESH */
function restoreSelectedButtons() {

    const buttons =
        document.querySelectorAll(".book");

    buttons.forEach(function(button) {

        const onclickValue =
            button.getAttribute("onclick");

        if (!onclickValue) {
            return;
        }

        selectedServices.forEach(function(service) {

            if (
                onclickValue.includes(
                    "'" + service + "'"
                )
            ) {

                button.classList.add("added");

                button.textContent =
                    "✓ ADDED";
            }
        });
    });
}


/* INITIAL LOAD */
updateBasket();
restoreSelectedButtons();
</script>
